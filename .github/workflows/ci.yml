name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: test / ${{ matrix.os }} / ${{ matrix.suite }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, suite: full }
          - { os: windows-latest, suite: windows-registry }
    steps:
      - name: Configure Windows Git
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          echo "MSYSTEM=MINGW64" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "MSYS2_PATH_TYPE=inherit" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "SCHEME=scheme" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "CC=gcc" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Idris 2 build dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            chezscheme \
            git \
            libffi-dev \
            libgmp-dev \
            libncurses-dev \
            libssl-dev \
            make \
            pkg-config

      - name: Install Idris 2
        if: runner.os == 'Linux'
        shell: bash
        run: |
          git clone --depth 1 --branch v0.8.0 https://github.com/idris-lang/Idris2.git /tmp/Idris2
          make -C /tmp/Idris2 bootstrap SCHEME=chezscheme
          make -C /tmp/Idris2 install
          echo "$HOME/.idris2/bin" >> "$GITHUB_PATH"
          rm -rf /tmp/Idris2

      - name: Install Windows build dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git clone --depth 1 --branch v10.4.1 --recurse-submodules --shallow-submodules https://github.com/cisco/ChezScheme "$env:RUNNER_TEMP\ChezScheme"
          git clone --depth 1 --branch v0.8.0 https://github.com/idris-lang/Idris2.git "$env:RUNNER_TEMP\Idris2"
          c:\msys64\usr\bin\bash -l -c "pacman -S --noconfirm tar make mingw-w64-x86_64-gcc"
          echo "C:\msys64\usr\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build Chez Scheme on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $chez = c:\msys64\usr\bin\cygpath -u "$env:RUNNER_TEMP\ChezScheme"
          c:\msys64\usr\bin\bash -l -c "cd '$chez' && ./configure --threads && make"

      - name: Configure Windows Idris paths
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $chezBin = "$env:RUNNER_TEMP\ChezScheme\ta6nt\bin\ta6nt"
          $idrisPrefix = "$env:RUNNER_TEMP\.idris2"
          $unixPrefix = c:\msys64\usr\bin\cygpath -u "$idrisPrefix"
          if (-not (Test-Path (Join-Path $chezBin "scheme.exe"))) {
            throw "Chez Scheme binary not found at $chezBin"
          }
          echo "$chezBin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "$idrisPrefix\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "PREFIX=$unixPrefix" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install Idris 2 on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $idrisSource = c:\msys64\usr\bin\cygpath -u "$env:RUNNER_TEMP\Idris2"
          c:\msys64\usr\bin\bash -l -c "cd '$idrisSource' && make bootstrap && make install"

      - name: Verify Idris 2
        run: idris2 --version

      - name: Build library
        run: idris2 --build iotaTime.ipkg

      - name: Install library package
        run: idris2 --install iotaTime.ipkg

      - name: Clean library workspace artifacts
        run: idris2 --clean iotaTime.ipkg

      - name: Build tests
        if: matrix.suite == 'full'
        run: idris2 --build test/iotaTime-test.ipkg

      - name: Run tests
        if: matrix.suite == 'full'
        shell: bash
        run: ./test/build/exec/iotaTime-test

      - name: Run compile-fail tests
        if: matrix.suite == 'full'
        shell: bash
        run: sh test/run-compile-fail-tests.sh

      - name: Build end-to-end example
        if: matrix.suite == 'full'
        run: idris2 --build examples/iotaTime-examples.ipkg

      - name: Run end-to-end example
        if: matrix.suite == 'full'
        shell: bash
        run: |
          output=$(./examples/build/exec/iotaTime-zoned-meeting)
          test "$output" = "2024-04-23T09:00:00 Europe/Zurich"

      - name: Build Windows registry smoke tests
        if: matrix.suite == 'windows-registry'
        run: idris2 --build test/windows-smoke.ipkg

      - name: Run Windows registry smoke tests
        if: matrix.suite == 'windows-registry'
        shell: pwsh
        run: |
          $binary = Get-ChildItem `
            -Path @(".\test\build\exec", ".\build\exec") `
            -Filter "iotaTime-windows-smoke*" `
            -File `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if ($null -eq $binary) {
            throw "Windows smoke-test executable not found in test/build/exec or build/exec"
          }
          & $binary.FullName

  release:
    name: publish GitHub release
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify release version
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          package_version=$(sed -n 's/^version = //p' iotaTime.ipkg)
          make_version=$(sed -n 's/^PACKAGE_VERSION := //p' Makefile)
          test "$version" = "$package_version"
          test "$version" = "$make_version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install Idris 2 build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            chezscheme \
            git \
            libffi-dev \
            libgmp-dev \
            libncurses-dev \
            libssl-dev \
            make \
            pkg-config

      - name: Install Idris 2
        run: |
          git clone --depth 1 --branch v0.8.0 https://github.com/idris-lang/Idris2.git /tmp/Idris2
          make -C /tmp/Idris2 bootstrap SCHEME=chezscheme
          make -C /tmp/Idris2 install
          echo "$HOME/.idris2/bin" >> "$GITHUB_PATH"

      - name: Build release archives
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          npm ci --prefix docs
          idris2 --mkdoc iotaTime.ipkg
          node docs/enhance-docs.mjs build/docs
          mkdir release
          git archive \
            --format=tar.gz \
            --prefix="iotaTime-$VERSION/" \
            --output="release/iotaTime-$VERSION.tar.gz" \
            "$GITHUB_SHA"
          tar -C build/docs -czf "release/iotaTime-$VERSION-docs.tar.gz" .
          sha256sum release/*.tar.gz > "release/iotaTime-$VERSION-sha256.txt"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/*

  publish-pack:
    name: submit pack-db release
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PACK_DB_TOKEN: ${{ secrets.PACK_DB_TOKEN }}
    steps:
      - name: Verify pack-db credentials
        run: |
          if test -z "$PACK_DB_TOKEN"; then
            echo "PACK_DB_TOKEN is required; see RELEASE.md" >&2
            exit 1
          fi

      - name: Checkout pack-db fork
        uses: actions/checkout@v4
        with:
          repository: jason-johnson/idris2-pack-db
          token: ${{ secrets.PACK_DB_TOKEN }}
          path: pack-db
          fetch-depth: 0

      - name: Update iotaTime package entry
        id: package
        working-directory: pack-db
        run: |
          version="${GITHUB_REF_NAME#v}"
          branch="iotatime-$version"
          git remote add upstream https://github.com/stefan-hoeck/idris2-pack-db.git
          git fetch upstream main
          git fetch origin "$branch:refs/remotes/origin/$branch" || true
          git switch -C "$branch" upstream/main
          sed -i '/^\[db\.iotaTime\]$/,/^$/d' collections/HEAD.toml
          cat >> collections/HEAD.toml <<EOF

          [db.iotaTime]
          type   = "github"
          url    = "https://github.com/jason-johnson/iotaTime"
          commit = "$GITHUB_SHA"
          ipkg   = "iotaTime.ipkg"
          test   = "test/iotaTime-test.ipkg"
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add collections/HEAD.toml
          git commit -m "[ iotaTime ] Release $version"
          git push --force-with-lease="$branch" origin "$branch"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Report pack-db pull request URL
        env:
          BRANCH: ${{ steps.package.outputs.branch }}
        run: |
          url="https://github.com/stefan-hoeck/idris2-pack-db/compare/main...jason-johnson:$BRANCH?expand=1"
          echo "Open the pack-db pull request manually: $url" >> "$GITHUB_STEP_SUMMARY"
