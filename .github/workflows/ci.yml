name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Idris 2 build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            chezscheme \
            git \
            libffi-dev \
            libgmp-dev \
            libncurses-dev \
            libssl-dev \
            make \
            pkg-config

      - name: Install Idris 2
        run: |
          git clone --depth 1 --branch v0.7.0 https://github.com/idris-lang/Idris2.git /tmp/Idris2
          make -C /tmp/Idris2 bootstrap SCHEME=chezscheme
          make -C /tmp/Idris2 install
          echo "$HOME/.idris2/bin" >> "$GITHUB_PATH"
          rm -rf /tmp/Idris2

      - name: Verify Idris 2
        run: idris2 --version

      - name: Build library
        run: idris2 --build iotaTime.ipkg

      - name: Install library package
        run: idris2 --install iotaTime.ipkg

      - name: Build tests
        run: idris2 --build test/iotaTime-test.ipkg

      - name: Run tests
        run: ./test/build/exec/iotaTime-test
